name: ats_utilities_interface_checker

permissions:
  contents: read

on:
  push:
    branches: [ master ]
    paths:
      - 'ats_utilities/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'ats_utilities/**'

jobs:
  interface_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify that each concrete class implements a valid interface
        run: |
          python3 gates/gates/interfaces_checker.py ats_utilities
