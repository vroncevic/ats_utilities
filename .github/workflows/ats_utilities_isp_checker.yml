name: ats_utilities_isp_checker

permissions:
  contents: read

on:
  push:
    branches: [ master ]
    paths:
      - 'ats_utilities/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'ats_utilities/**'

jobs:
  isp_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check Interface Segregation Principle violations
        run: |
          python3 gates/gates/isp_checker.py ats_utilities
